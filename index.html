<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchweißWerkstatt 2.0 | Mission Geländerbau</title><style>
:root{--bg:#0b1422;--panel:#152337;--panel2:#1d3048;--line:#36506a;--text:#eff5fc;--muted:#b5c7d9;--accent:#ffbc52;--good:#65d6ae;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(120deg,#182b43,#101c2d);border-bottom:1px solid var(--line);padding:20px max(20px,calc((100vw - 1100px)/2))}h1{font-size:clamp(25px,4vw,39px);margin:3px 0}h2{font-size:25px;margin:0 0 12px}h3{font-size:19px;margin:12px 0 8px}p{margin:9px 0 15px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;max-width:1160px;margin:24px auto;padding:0 20px}nav{position:sticky;top:16px;align-self:start;display:grid;gap:7px}nav button{text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:10px;cursor:pointer}nav button.active{background:#324a64;border-color:var(--accent)}main{min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:23px;margin-bottom:16px}.callout{border-left:4px solid var(--accent);background:var(--panel2);padding:15px;border-radius:5px;margin:15px 0}.task{background:#102033;border:1px solid #3b5974;padding:17px;border-radius:12px;margin:16px 0}.task>strong{color:var(--accent)}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#344c62;color:#e7f0fa;font-size:12px;margin:0 6px 8px 0}textarea,input[type=text]{width:100%;padding:12px;background:#081522;color:var(--text);border:1px solid #66819c;border-radius:8px;font:inherit}textarea{min-height:100px;resize:vertical}button.action{background:var(--accent);color:#18202a;border:0;padding:11px 17px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 8px 5px 0}button.secondary{background:#29415b;color:white;border:1px solid #55718c}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent)}.choices{display:grid;gap:8px}.choice{display:block;padding:10px 13px;border:1px solid #58728c;border-radius:8px;cursor:pointer}.choice:has(input:checked){background:#31506a;border-color:var(--accent)}.feedback{margin-top:10px;padding:12px;border-radius:8px;background:#29415b}.hidden{display:none}.progress{height:11px;background:#3a4c60;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--good);width:0;transition:width .2s}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diagram{background:#f2f6fb;color:#15243a;border-radius:12px;padding:14px;text-align:center}.diagram svg{width:100%;height:auto;max-height:180px}.diagram p{font-size:13px}.footerbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.criteria{border-collapse:collapse;width:100%}.criteria td,.criteria th{border:1px solid #57718b;padding:9px;text-align:left}.criteria th{background:#274059}.slide{background:#f4f7fa;color:#152439;padding:20px;border-radius:10px;margin:10px 0}.slide h3{color:#15375a}.slide p{white-space:pre-wrap}details{background:#233b54;padding:12px;border-radius:9px;margin:10px 0}summary{cursor:pointer;font-weight:700}#toast{position:fixed;bottom:15px;right:15px;background:#275840;padding:12px;border-radius:9px;display:none}ul{padding-left:23px}@media(max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;overflow:auto}nav button{min-width:140px}.cols{grid-template-columns:1fr}.panel{padding:17px}}@media print{body{background:white;color:black}header,nav,.footerbar,.no-print{display:none!important}.layout{display:block;margin:0;padding:0}.panel{border:0;color:black;page-break-inside:avoid}.slide{border:1px solid #888}textarea{color:black;background:white}}
</style></head><body><header><div class="eyebrow">Lernwerkstatt Metallbauer/in Konstruktionstechnik · 2. Ausbildungsjahr</div><h1>⚙️ SchweißWerkstatt 2.0</h1><p>Mission Geländerbau: Reklamation verstehen · Verbindungen planen · Qualität sichern</p><div class="progress"><div id="bar"></div></div><small id="status">0 von 6 Stationen bearbeitet · 90 Minuten</small></header><div class="layout"><nav id="nav"></nav><main id="content"></main></div><div id="toast" role="status"></div><script>
const stages=[['Auftrag','10 Min.'],['Fachwissen','20 Min.'],['Fehlerlabor','15 Min.'],['Konstruktion','20 Min.'],['Präsentation','15 Min.'],['Meistercheck','10 Min.']];let current=0;let state=JSON.parse(localStorage.getItem('sw2')||'{}');state.answers ||= {};state.done ||= [];function save(){localStorage.setItem('sw2',JSON.stringify(state))}function field(id,label,hint='',rows=4){return `<div class="task"><strong>${label}</strong>${hint?`<p class="muted">${hint}</p>`:''}<textarea rows="${rows}" data-field="${id}" placeholder="Hier eure fachliche Antwort eintragen …"></textarea></div>`}function quiz(id,q,opts,correct,why){return `<div class="task"><strong>${q}</strong><div class="choices">${opts.map((o,i)=>`<label class="choice"><input type="radio" name="${id}" value="${i}"> ${o}</label>`).join('')}</div><button class="action secondary" onclick="check('${id}',${correct},${JSON.stringify(why).replaceAll('"','&quot;')})">Antwort prüfen</button><div id="f-${id}" class="feedback hidden"></div></div>`}function reveal(id,html){return `<div class="task"><button class="action secondary" onclick="document.getElementById('${id}').classList.toggle('hidden')">Musterlösung / Hinweise einblenden</button><div class="feedback hidden" id="${id}">${html}</div></div>`}const templates=[
()=>`<div class="panel"><div class="eyebrow">Station 1 · 10 Minuten</div><h2>🚧 Die Reklamation</h2><span class="tag">Partnerarbeit</span><span class="tag">Analyse</span><p><strong>Ausgangslage (fiktiver Fall):</strong> Eure Metallbaufirma hat für einen Gewerbekunden ein Stahlgeländer gefertigt. Wenige Wochen nach der Montage reklamiert der Kunde: An einem Anschluss zwischen Pfosten und Rahmen sind sichtbare Unregelmäßigkeiten zu erkennen. Außerdem zeigen sich an einer Stelle Rostspuren.</p><div class="callout"><strong>E-Mail der Bauleitung</strong><p>„Bitte erläutern Sie uns, ob die Verbindung fachgerecht ausgeführt wurde und wie Sie bei der Prüfung und möglichen Nacharbeit vorgehen. Wir benötigen eine nachvollziehbare Stellungnahme.“</p></div><p><strong>Wichtig:</strong> Ein sichtbarer Mangel beweist allein noch nicht, dass eine Verbindung nicht tragfähig ist. Die tatsächliche Beurteilung erfordert Zeichnung, Anforderungen und geeignete Prüfungen durch befugte Fachleute.</p>${field('hyp','Aufgabe 1 · Erste Hypothesen','Notiert mindestens drei mögliche Ursachen oder Fragen, die ihr vor einer Bewertung klären müsst.')}${field('info','Aufgabe 2 · Welche Unterlagen braucht ihr?','Nennt mindestens vier Unterlagen oder Informationen für die technische Beurteilung.',3)}${quiz('start','Welche Aussage ist fachlich am sinnvollsten?',['Wenn die Naht glänzt, ist sie sicher.','Eine Sichtprüfung ist ein erster Schritt, ersetzt aber nicht jede erforderliche weitere Prüfung.','Rostspuren bedeuten automatisch einen Bruch.'],1,'Sichtprüfung erkennt äußere Auffälligkeiten. Anforderungen, Werkstoff, Beanspruchung und ggf. weitere Prüfungen entscheiden über die Bewertung.')}${reveal('m1','Mögliche Punkte: Zeichnung, Werkstoffangaben, Schweißanweisung, Nahtanforderungen, Einsatzbedingungen, Korrosionsschutz, Fotos, Prüfprotokolle, Qualifikation und Fertigungsdokumentation.')}</div>`,
()=>`<div class="panel"><div class="eyebrow">Station 2 · 20 Minuten</div><h2>📚 Fachwissen: Verfahren und Verbindungen</h2><span class="tag">Lesen und auswerten</span><span class="tag">Wissen anwenden</span><h3>Fachtext A · Drei Lichtbogenschweißverfahren</h3><p><strong>MAG-Schweißen (Metall-Aktivgasschweißen):</strong> Ein kontinuierlich zugeführter abschmelzender Drahtelektroden-Zusatzwerkstoff bildet mit dem Werkstück einen Lichtbogen. Ein aktives Schutzgas oder Mischgas schützt den Prozess und beeinflusst das Schweißverhalten. MAG ist im Stahlbau verbreitet und bei geeigneten Randbedingungen wirtschaftlich. Zugluft kann die Schutzgaswirkung beeinträchtigen.</p><p><strong>MIG-Schweißen (Metall-Inertgasschweißen):</strong> Auch hier schmilzt ein kontinuierlich zugeführter Draht ab. Das Schutzgas ist inert, etwa Argon. MIG wird häufig für Nichteisenmetalle wie Aluminium eingesetzt; die genaue Verfahrenswahl hängt von Werkstoff und Aufgabe ab.</p><p><strong>WIG-Schweißen (Wolfram-Inertgasschweißen):</strong> Eine nicht abschmelzende Wolframelektrode erzeugt den Lichtbogen. Zusatzwerkstoff kann getrennt zugeführt werden. Das Verfahren ermöglicht gute Kontrolle und saubere Nähte, ist bei vielen Anwendungen aber langsamer als mechanisiertes oder halbmechanisiertes MAG-Schweißen.</p><h3>Fachtext B · Nahtformen und Vorbereitung</h3><p>Bei einem <strong>Stumpfstoß</strong> treffen Bauteile mit ihren Kanten aufeinander; je nach Blechdicke und Anforderungen ist eine passende Nahtvorbereitung erforderlich. Bei einem <strong>T-Stoß</strong> steht ein Bauteil annähernd rechtwinklig auf einem anderen; hier wird häufig eine <strong>Kehlnaht</strong> eingesetzt. Die <strong>Nahtdicke a</strong> beschreibt bei Kehlnähten die rechnerisch maßgebende Nahtdicke. Sie darf nicht nach Augenmaß als tragfähig festgelegt werden. Maßgeblich sind die konstruktiven Anforderungen und gültigen Vorgaben.</p><div class="callout">📝 <strong>Leseauftrag:</strong> Findet in den Texten (1) die Unterschiede der Elektroden, (2) die Schutzgasarten und (3) zwei Gründe, warum die Schweißnahtwahl nicht nur vom Aussehen abhängt.</div>${field('compare','Aufgabe 3 · Vergleichstabelle in eigenen Worten','Vergleicht MAG, MIG und WIG hinsichtlich Elektrode, Schutzgas und typischer Anwendung. Nutzt Stichpunkte.',5)}${quiz('qmag','Welches Verfahren ist für viele Stahlkonstruktionen in der Werkstatt ein naheliegender Ausgangspunkt?',['MAG','MIG mit Argon als pauschale Standardlösung','WIG ist grundsätzlich immer schneller'],0,'MAG ist für viele Stahlkonstruktionen wirtschaftlich; konkrete Anforderungen und Werkstoffe bleiben entscheidend.')}${quiz('qt','Welcher Zusammenhang ist korrekt?',['T-Stoß und Kehlnaht sind identische Begriffe.','T-Stoß beschreibt die Bauteilanordnung, Kehlnaht eine Nahtform.','Stumpfstoß bedeutet immer eine Kehlnaht.'],1,'Stoßart und Nahtart sind zu unterscheiden.')}${quiz('qwig','Was ist typisch für WIG?',['Abschmelzende Drahtelektrode im Brenner','Nicht abschmelzende Wolframelektrode','Kein Schutzgas erforderlich'],1,'Beim WIG-Schweißen wird eine nicht abschmelzende Wolframelektrode verwendet.')}${reveal('m2','MAG: abschmelzender Draht, aktives Gas/Mischgas, häufig Stahl. MIG: abschmelzender Draht, inertes Gas, häufig Aluminium. WIG: nicht abschmelzende Wolframelektrode, inertes Gas, hohe Kontrolle. Die konkrete Eignung muss im Einzelfall geprüft werden.')}</div>`,
()=>`<div class="panel"><div class="eyebrow">Station 3 · 15 Minuten</div><h2>🔎 Fehlerlabor</h2><span class="tag">Diagnose</span><span class="tag">Ursache – Maßnahme</span><p><strong>Fachtext C · Fehler erkennen</strong></p><p><strong>Poren:</strong> Gasförmige Einschlüsse im erstarrten Schweißgut. Mögliche Ursachen sind unzureichende Schutzgaswirkung, Verschmutzungen oder ungünstige Prozessbedingungen. <strong>Einbrandkerben:</strong> Vertiefungen am Nahtübergang, die beispielsweise durch ungeeignete Parameter oder Brennerführung entstehen können. <strong>Bindefehler:</strong> Bereiche, in denen Schweißgut und Grundwerkstoff oder benachbarte Lagen nicht ausreichend verschmolzen sind. <strong>Risse:</strong> Können verschiedene Ursachen haben, etwa ungünstige Spannungs-, Werkstoff- und Temperaturbedingungen. <strong>Korrosion:</strong> Ist nicht automatisch ein Schweißfehler; sie kann etwa mit mangelhafter Oberflächenvorbereitung oder beschädigtem Korrosionsschutz zusammenhängen.</p><p>Eine Sichtprüfung ist häufig ein sinnvoller erster Schritt. Ob eine Unregelmäßigkeit zulässig ist, richtet sich nach den festgelegten Qualitätsanforderungen, nicht nach persönlichem Geschmack.</p>${quiz('f1','Fall A: In der Naht sind mehrere kleine, runde Öffnungen sichtbar. Was liegt als Vermutung nahe?',['Poren','Einbrandkerbe','Verzug'],0,'Sichtbare runde Öffnungen können auf Poren hinweisen. Ursachen müssen geprüft werden.')}${quiz('f2','Fall B: Am Rand einer Naht verläuft eine deutliche Rinne im Grundwerkstoff.','Einbrandkerbe','Poren','Korrosion'],0,'Eine Rinne am Nahtübergang kann eine Einbrandkerbe sein.')}${quiz('f3','Fall C: Nach dem Beschichten zeigt der Bereich neben einer Naht Rostspuren.','Zwingend ein Bindefehler','Möglicherweise ein Problem der Oberflächenvorbereitung oder des Korrosionsschutzes','Sicher ein WIG-Fehler'],1,'Korrosion kann verschiedene Ursachen haben. Beschichtung und Oberflächenvorbereitung prüfen.')}${field('fault','Aufgabe 4 · Diagnoseprotokoll','Wählt zwei Fälle aus. Notiert jeweils: Beobachtung – mögliche Ursache – geeignete weitere Prüfung – vorbeugende Maßnahme.',6)}${reveal('m3','Beispiel: Poren → mögliche unzureichende Schutzgaswirkung oder Verunreinigung → Prozessbedingungen und Naht prüfen → Schutzgasführung und Sauberkeit verbessern. Einbrandkerbe → Parameter/Brennerführung prüfen → fachgerechte Verfahrenseinstellung. Keine automatische Freigabe oder Reparatur allein anhand dieser Beispiele.')}</div>`,
()=>`<div class="panel"><div class="eyebrow">Station 4 · 20 Minuten</div><h2>📐 Der Konstruktionsauftrag</h2><span class="tag">Teamplanung</span><span class="tag">Technische Begründung</span><p><strong>Fiktiver Fertigungsauftrag:</strong> Ein rechteckiger Geländerrahmen aus Baustahlprofilen wird in einer Werkstatt gefertigt. Ein Pfosten wird mit einer Grundplatte verbunden; ein Querholm trifft auf einen Pfosten. Die Skizzen zeigen nur die <em>Prinzipien</em> der Verbindungen, keine ausführungsreifen Konstruktionsdetails.</p><div class="cols"><div class="diagram"><svg viewBox="0 0 260 160" role="img" aria-label="Prinzipskizze Pfosten auf Grundplatte"><rect x="45" y="124" width="175" height="17" fill="#8da1b5" stroke="#1c334c" stroke-width="2"/><rect x="112" y="22" width="44" height="102" fill="#c7d2de" stroke="#1c334c" stroke-width="2"/><path d="M103 124 L112 112 L112 124 Z M156 124 L156 112 L165 124 Z" fill="#e69c42" stroke="#89521a" stroke-width="2"/><text x="130" y="155" text-anchor="middle" font-size="13">Pfosten / Grundplatte</text></svg><p>Prinzip: T-artiger Anschluss mit Kehlnähten (schematisch)</p></div><div class="diagram"><svg viewBox="0 0 260 160" role="img" aria-label="Prinzipskizze Querholm an Pfosten"><rect x="172" y="15" width="37" height="125" fill="#c7d2de" stroke="#1c334c" stroke-width="2"/><rect x="27" y="54" width="145" height="40" fill="#aebdca" stroke="#1c334c" stroke-width="2"/><path d="M172 48 L163 54 L172 54 Z M172 94 L163 94 L172 101 Z" fill="#e69c42" stroke="#89521a" stroke-width="2"/><text x="125" y="155" text-anchor="middle" font-size="13">Querholm / Pfosten</text></svg><p>Prinzip: Anschluss eines Querholms an einen Pfosten</p></div></div><div class="callout"><strong>Planungsgrenzen:</strong> Maße, Lasten, Materialdicken und Normnachweise fehlen bewusst. Ihr entwickelt ein begründetes Fertigungskonzept – <strong>keine</strong> statische Bemessung und keine Freigabe für die tatsächliche Montage.</div>${field('joint','Aufgabe 5 · Verbindungskonzept','Welche Stoß- und Nahtarten kommen an den beiden Anschlüssen grundsätzlich in Betracht? Was müsste für eine endgültige Festlegung bekannt sein?',5)}${field('process','Aufgabe 6 · Verfahrensentscheidung','Wählt für den fiktiven Werkstattauftrag ein plausibles Schweißverfahren und begründet eure Wahl mit mindestens drei Kriterien.',4)}${field('sequence','Aufgabe 7 · Arbeits- und Qualitätssicherungsplan','Erstellt sechs bis acht Schritte von der Zeichnungsprüfung bis zur Dokumentation. Berücksichtigt Sicherheit, Verzug, Prüfung und Korrosionsschutz.',6)}${quiz('design','Wer legt bei einer sicherheitsrelevanten Konstruktion die erforderliche Nahtausführung verbindlich fest?',['Die Person, der die Naht optisch am besten gefällt','Die zuständige Planung auf Grundlage der Anforderungen, Nachweise und geltenden Regeln','Jede beliebige Person in der Werkstatt'],1,'Die konkrete Ausführung muss auf verbindlichen technischen Unterlagen und erforderlichen Nachweisen beruhen.')}${reveal('m4','Beispielhafte Planung: Unterlagen/Lastannahmen klären → Werkstoff und Schweißanweisung prüfen → Bauteile vorbereiten → heften und Maßhaltigkeit kontrollieren → nach freigegebenem Verfahren schweißen → ggf. Verzug korrigieren → vorgeschriebene Prüfungen dokumentieren → Oberflächenvorbereitung und Korrosionsschutz ausführen. Schweißnahtmaße und tragende Details dürfen nicht aus dieser Übung übernommen werden.')}</div>`,
()=>`<div class="panel"><div class="eyebrow">Station 5 · 15 Minuten</div><h2>🎤 Teampräsentation</h2><span class="tag">3 Minuten je Team</span><span class="tag">Peer-Feedback</span><p>Bereitet einen <strong>3-minütigen Pitch</strong> vor. Zeigt der Klasse eure Entscheidungen. Nutzt die automatische Präsentationsansicht aus euren Eingaben oder sprecht frei.</p><div class="task"><strong>Präsentationsstruktur</strong><ol><li><strong>30 Sek.:</strong> Welche Risiken seht ihr bei der Reklamation?</li><li><strong>60 Sek.:</strong> Welches Verfahren und welche Nahtprinzipien schlagt ihr vor – und warum?</li><li><strong>60 Sek.:</strong> Wie sieht euer Prüf- und Arbeitsplan aus?</li><li><strong>30 Sek.:</strong> Welche Informationen fehlen für eine Freigabe?</li></ol><button class="action" onclick="renderSlides()">Präsentation aus Antworten erstellen</button><button class="action secondary" onclick="window.print()">Präsentation / Antworten drucken</button><div id="slides"></div></div><h3>Feedback der Zuhörenden</h3><table class="criteria"><tr><th>Kriterium</th><th>0</th><th>1</th><th>2</th></tr><tr><td>Fachbegriffe korrekt</td><td>☐</td><td>☐</td><td>☐</td></tr><tr><td>Entscheidung begründet</td><td>☐</td><td>☐</td><td>☐</td></tr><tr><td>Qualität/Sicherheit berücksichtigt</td><td>☐</td><td>☐</td><td>☐</td></tr><tr><td>Verständliche Präsentation</td><td>☐</td><td>☐</td><td>☐</td></tr></table>${field('feedback','Aufgabe 8 · Peer-Feedback','Nennt eine Stärke und eine konkrete Rückfrage an das präsentierende Team.',3)}<div class="callout"><strong>Lehrkraft-Tipp:</strong> Bei großen Klassen 3–4 Teams präsentieren lassen, übrige Teams geben Feedback. Alternativ Galeriegang mit 2 Minuten Austausch pro Gruppe.</div></div>`,
()=>`<div class="panel"><div class="eyebrow">Station 6 · 10 Minuten</div><h2>🏁 Meistercheck und Reflexion</h2><span class="tag">Individuelle Sicherung</span>${quiz('end1','Welche Kombination ist fachlich korrekt?',['MAG – aktive Schutzgaswirkung – abschmelzender Draht','WIG – abschmelzende Wolframelektrode','MIG – grundsätzlich ohne Schutzgas'],0,'MAG verwendet einen abschmelzenden Draht und aktive Schutzgasanteile.')}${quiz('end2','Was beschreibt die Nahtdicke a bei einer Kehlnaht?',['Eine beliebige optische Breite','Die rechnerisch maßgebende Nahtdicke','Die Gesamtlänge des Pfostens'],1,'Die a-Maß-Angabe ist eine wichtige geometrische Nahtkenngröße.')}${quiz('end3','Welche Aussage zu Schweißfehlern trifft zu?',['Alle sichtbaren Unregelmäßigkeiten sind automatisch unzulässig.','Die Zulässigkeit hängt von den geforderten Qualitätsanforderungen ab.','Risse dürfen immer ignoriert werden.'],1,'Bewertungen erfolgen anhand definierter Anforderungen; kritische Befunde erfordern fachliche Abklärung.')}${quiz('end4','Warum ist Korrosionsschutz bei Geländerkonstruktionen wichtig?',['Weil er die statische Berechnung ersetzt','Weil er die Dauerhaftigkeit der Konstruktion beeinflusst','Weil er jeden Schweißfehler repariert'],1,'Korrosionsschutz dient der Dauerhaftigkeit, ersetzt aber keine fachgerechte Verbindung oder Prüfung.')}${field('reflection','Exit-Ticket','Vervollständige: „Heute habe ich verstanden, dass …“ und „Bei einer realen Geländerkonstruktion müsste ich noch klären, …“',4)}<div class="callout"><strong>Geschafft!</strong> Sichert eure Antworten als Datei. Für eine benotete Bewertung zählt besonders die Qualität eurer technischen Begründungen – nicht allein die Zahl richtiger Quizantworten.</div><button class="action" onclick="exportTxt()">Alle Antworten als Textdatei speichern</button><button class="action secondary" onclick="resetAll()">Neuen Kursdurchlauf starten</button></div>`];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('nav').innerHTML=stages.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${state.done.includes(i)?'✓ ':''}${i+1}. ${s[0]}<br><small>${s[1]}</small></button>`).join('');document.getElementById('content').innerHTML=templates[current]()+`<div class="footerbar no-print"><button class="action secondary" onclick="go(${Math.max(0,current-1)})" ${current===0?'disabled':''}>← Zurück</button><button class="action" onclick="finish()">${current===5?'Station abschließen':'Station abschließen & weiter →'}</button></div>`;document.querySelectorAll('[data-field]').forEach(el=>{el.value=state.answers[el.dataset.field]||'';el.addEventListener('input',()=>{state.answers[el.dataset.field]=el.value;save()})});document.querySelectorAll('input[type=radio]').forEach(el=>{el.checked=state.answers[el.name]===el.value;el.addEventListener('change',()=>{state.answers[el.name]=el.value;save()})});progress()}function progress(){document.getElementById('bar').style.width=state.done.length/6*100+'%';document.getElementById('status').textContent=`${state.done.length} von 6 Stationen abgeschlossen · 90 Minuten`}function go(i){current=i;render();window.scrollTo(0,0)}function finish(){if(!state.done.includes(current))state.done.push(current);save();if(current<5)go(current+1);else{render();toast('Lernwerkstatt abgeschlossen! Antworten jetzt sichern.')}}function check(id,correct,why){let ans=state.answers[id];let f=document.getElementById('f-'+id);f.classList.remove('hidden');f.textContent=ans===undefined?'Bitte zuerst eine Antwort auswählen.':Number(ans)===correct?'✓ Richtig. '+why:'Noch nicht richtig. '+why}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}function renderSlides(){let parts=[['Unsere Analyse',state.answers.hyp],['Schweißverfahren und Verbindung',`Verfahren: ${state.answers.process||'Noch nicht bearbeitet'}\n\nVerbindungen: ${state.answers.joint||'Noch nicht bearbeitet'}`],['Qualitätssicherung',state.answers.sequence],['Offene Fragen',state.answers.info]];document.getElementById('slides').innerHTML=parts.map(([title,body],i)=>`<div class="slide"><small>Folie ${i+1}</small><h3>${esc(title)}</h3><p>${esc(body||'Noch nicht ausgefüllt')}</p></div>`).join('')}function exportTxt(){let names={hyp:'Erste Hypothesen',info:'Benötigte Unterlagen',compare:'Verfahrensvergleich',fault:'Fehlerdiagnose',joint:'Verbindungskonzept',process:'Verfahrensentscheidung',sequence:'Arbeits- und Prüfplan',feedback:'Peer-Feedback',reflection:'Reflexion'};let txt='SCHWEISSWERKSTATT 2.0 – TEAMERGEBNISSE\n\n'+Object.entries(names).map(([k,n])=>n+'\n'+(state.answers[k]||'(nicht ausgefüllt)')).join('\n\n')+'\n\nHinweis: Lernübung, keine ausführungsreife Schweißplanung.';let blob=new Blob([txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='schweisswerkstatt-ergebnisse.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetAll(){if(confirm('Alle gespeicherten Antworten auf diesem Gerät löschen?')){localStorage.removeItem('sw2');state={answers:{},done:[]};go(0)}}render();</script></body></html>
